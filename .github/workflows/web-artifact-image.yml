name: Web Artifact Image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-artifact-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openchamber-web-artifact

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build web package
        run: bun run build:web

      - name: Pack web artifact
        run: |
          bun run pack:web
          mv packages/web/openchamber-web-*.tgz packages/web/openchamber.tgz
          cd packages/web
          sha256sum openchamber.tgz > SHA256SUMS

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish artifact image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: packages/web
          file: packages/web/Dockerfile.artifact
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Built @openchamber/web package artifact

      - name: Verify published artifact image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker pull "$IMAGE"
          container_id="$(docker create "$IMAGE" /bin/true)"
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          docker cp "$container_id:/openchamber.tgz" /tmp/openchamber.tgz
          docker cp "$container_id:/SHA256SUMS" /tmp/SHA256SUMS
          cmp packages/web/openchamber.tgz /tmp/openchamber.tgz
          cd /tmp
          sha256sum --check SHA256SUMS

      - name: Publish latest tag
        if: github.ref == 'refs/heads/main'
        run: docker buildx imagetools create --tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${GITHUB_SHA}"
