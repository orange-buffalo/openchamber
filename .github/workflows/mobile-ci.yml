name: Mobile Smoke Build

on:
  push:
  workflow_dispatch:

jobs:
  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: |
            packages/mobile/android/**/*.gradle*
            packages/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Install dependencies
        run: bun install

      - name: Type-check mobile package
        run: bun run type-check:mobile

      - name: Lint mobile package
        run: bun run lint:mobile

      - name: Prepare Android keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name secret is required."
              exit 1
            fi
          done
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openchamber-release.keystore"

      - name: Build signed Android release APK
        env:
          OPENCHAMBER_ANDROID_VERSION_CODE: ${{ github.run_number }}
          OPENCHAMBER_ANDROID_VERSION_NAME: ${{ github.event.repository.name }}-${{ github.run_number }}
          OPENCHAMBER_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/openchamber-release.keystore
          OPENCHAMBER_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENCHAMBER_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENCHAMBER_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bun run mobile:sync
          ./packages/mobile/android/gradlew -p packages/mobile/android assembleRelease

      - name: Upload Android release APK
        uses: actions/upload-artifact@v4
        with:
          name: openchamber-android-${{ github.run_number }}-${{ github.sha }}
          path: packages/mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish-android:
    name: Publish rolling Android release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: android-release
    runs-on: ubuntu-latest
    concurrency:
      group: android-rolling-release
      cancel-in-progress: true
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: openchamber-android-${{ github.run_number }}-${{ github.sha }}
          path: release-assets

      - name: Prepare rolling release files
        env:
          APK_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download/android-latest/OpenChamber-android.apk
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cp release-assets/*.apk release-assets/OpenChamber-android.apk
          jq -n \
            --argjson versionCode "${{ github.run_number }}" \
            --arg versionName "${{ github.event.repository.name }}-${{ github.run_number }}" \
            --arg commit "${{ github.sha }}" \
            --arg publishedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg apkUrl "$APK_URL" \
            --arg runUrl "$RUN_URL" \
            '{ versionCode: $versionCode, versionName: $versionName, commit: $commit, publishedAt: $publishedAt, apkUrl: $apkUrl, runUrl: $runUrl }' \
            > release-assets/android-latest.json

      - name: Publish rolling Android release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TITLE: Android latest build (${{ github.run_number }})
          RELEASE_NOTES: Built from ${{ github.sha }} by ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
        run: |
          if ! gh release view android-latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create android-latest \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "$RELEASE_TITLE" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          fi
          gh release upload android-latest \
            release-assets/OpenChamber-android.apk \
            release-assets/android-latest.json \
            --repo "${{ github.repository }}" \
            --clobber
          gh release edit android-latest \
            --repo "${{ github.repository }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --prerelease

  ios-simulator:
    name: iOS simulator app
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Build iOS simulator app
        run: bun run mobile:build:ios:simulator
